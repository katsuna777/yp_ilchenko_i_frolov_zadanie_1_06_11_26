name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify reproducible resource import
        run: |
          python3 scripts/generate_seed.py
          git diff --exit-code database/seed.sql
      - name: Run integration checks
        env:
          CHUDO_TEST_PASSWORD: test-only-password
        run: dotnet run --project tests/ChudoObuv.IntegrationTests -c Release
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build ChudoObuv.sln -c Release
      - name: Publish Windows app with runtime
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ChudoObuv-win-x64
          path: artifacts/ChudoObuv-win-x64.zip
          retention-days: 30
